name: COBOL to Rust equivalence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gnucobol

      - name: Record compiler versions
        run: |
          cobc --version
          rustc --version

      - name: Verify equivalence and mutation detection
        run: ./run.sh
